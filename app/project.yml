name: DeutschBegleiter
options:
  bundleIdPrefix: com.hayden
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  DesignKit:
    path: Packages/DesignKit
  SRSKit:
    path: Packages/SRSKit
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1

targets:
  DeutschBegleiter:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: DeutschBegleiter
    dependencies:
      - package: DesignKit
        product: DesignKit
      - package: SRSKit
        product: SRSKit
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayden.DeutschBegleiter
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # Simulator and Mac only — no provisioning profile needed, and no
        # personal team id in a public repo. Add DEVELOPMENT_TEAM if you ever
        # build for a physical device.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        INFOPLIST_KEY_CFBundleDisplayName: Deutsch-Begleiter
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Übe Deutsch, indem du sprichst.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Erkennt deine Aussprache.
        # No [sdk=iphoneos*] condition: the simulator SDK is
        # "iphonesimulator" and does not match, which left the app without a
        # launch screen and letterboxed in an iPhone-8-sized window.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone": UIInterfaceOrientationPortrait
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
